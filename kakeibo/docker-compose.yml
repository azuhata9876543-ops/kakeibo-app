services:
  db:
    image: mysql:8.0
    container_name: kakeibo_mysql
    environment:
      MYSQL_DATABASE: kakeibo_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: kakeibo_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8000:80"
    depends_on:
      - db

volumes:
  mysql_data:
